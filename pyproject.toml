[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crossarm"
version = "1.9.0"
description = "ABB RAPID to FANUC TP converter: turns ABB robot programs and RobotWare backups into FANUC .LS programs, with a conversion report"
readme = "README.md"
requires-python = ">=3.11"
license = "BUSL-1.1"
authors = [{ name = "Enzo LEROY" }]
license-files = ["LICENSE"]
dependencies = []  # runtime: standard library only, on purpose
keywords = [
    "ABB", "RAPID", "FANUC", "TP", "LS", "robot program converter", "industrial robot", "robotics",
    "RobotStudio", "ROBOGUIDE", "RobotWare", "offline programming", "robot migration", "teach pendant",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/LeroyDu56/CrossArm"
Download = "https://github.com/LeroyDu56/CrossArm/releases/latest"
Documentation = "https://github.com/LeroyDu56/CrossArm#readme"
Changelog = "https://github.com/LeroyDu56/CrossArm/blob/main/CHANGELOG.md"
Issues = "https://github.com/LeroyDu56/CrossArm/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
crossarm = "crossarm.cli:main"

[project.gui-scripts]
crossarm-gui = "crossarm.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crossarm = ["karel/*.kl"]  # the KAREL library (--karel), read with importlib.resources

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Robot controllers stamp programs with naive local time: timezone rules do not apply.
ignore = ["DTZ"]
