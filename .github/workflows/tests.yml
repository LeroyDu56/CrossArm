name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest moves to 26.04 from 2026-10-19: both Ubuntu LTS are named rather than left to the alias
        os: [ubuntu-24.04, ubuntu-26.04, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests tools
      - name: Tests
        # The local test corpus is not in the repository: those tests are skipped.
        # Windows runners can open a Tk window: the desktop app's tests must run there, not skip.
        env:
          CROSSARM_REQUIRE_GUI: ${{ runner.os == 'Windows' && '1' || '' }}
        run: python -m pytest -ra --junitxml=junit.xml
      - name: Failed tests as annotations
        if: failure()
        run: python tools/ci_annotate.py junit.xml
